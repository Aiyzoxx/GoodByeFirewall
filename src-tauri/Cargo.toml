[package]
name = "goodbyefirewall"
version = "1.0.1"
description = "GoodByeFirewall"
authors = ["Aiyzoxx"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"


[lib]
name = "app_lib"
crate-type = ["rlib"]

[[bin]]
name = "GoodByeFirewall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
